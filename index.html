<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pythagoras Pathways – AI Math Differentiator</title>
<style>
  :root { --bg:#f3f6f4; --ink:#17302b; --muted:#52665f; --line:#cdd9d4; --card:#fff;
          --basic:#2f8f6b; --inter:#2f6fb0; --adv:#a8452f; --accent:var(--basic); }
  body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.55 Georgia,"Times New Roman",serif; }
  main { max-width:680px; margin:0 auto; padding:20px 16px 60px; }
  h1 { font-size:1.7rem; margin:.2em 0 .1em; }
  .sub { color:var(--muted); margin:0 0 18px; }
  .levels { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .levels button { padding:12px 6px; border:2px solid var(--line); background:var(--card); border-radius:10px;
    font:600 1rem system-ui,sans-serif; cursor:pointer; color:var(--ink); }
  .levels button[aria-pressed="true"] { color:#fff; border-color:transparent; }
  #b-basic[aria-pressed="true"] { background:var(--basic); }
  #b-intermediate[aria-pressed="true"] { background:var(--inter); }
  #b-advanced[aria-pressed="true"] { background:var(--adv); }
  button:focus-visible, input:focus-visible { outline:3px solid #f0b429; outline-offset:2px; }
  .panel { background:var(--card); border:1px solid var(--line); border-left:6px solid var(--accent);
    border-radius:10px; padding:16px; margin-top:16px; }
  .panel h2 { margin:0 0 6px; font-size:1.05rem; }
  .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .actions button, .check button { padding:10px 14px; border-radius:8px; border:1px solid var(--accent);
    background:#fff; color:var(--ink); font:600 .95rem system-ui,sans-serif; cursor:pointer; }
  .check { display:flex; gap:8px; margin-top:12px; }
  .check input { flex:1; min-width:0; padding:10px; font-size:1rem; border:1px solid var(--line); border-radius:8px; }
  .check button { background:var(--accent); color:#fff; }
  .hint, .fb, .sol { margin-top:10px; padding:10px 12px; border-radius:8px; background:#eef4f1; }
  .fb.ok { background:#dff3e8; } .fb.no { background:#fbe9e4; }
  ol { padding-left:20px; margin:6px 0 0; }
  .status { color:var(--muted); font-style:italic; }
  [hidden] { display:none !important; }
  footer { color:var(--muted); font-size:.85rem; margin-top:28px; }
</style>
</head>
<body>
<main>
  <h1>Pythagoras Pathways</h1>
  <p class="sub">Pick your level. The AI writes a new Pythagorean theorem problem just for you.</p>

  <div class="levels" role="group" aria-label="Difficulty level">
    <button id="b-basic" data-level="basic" aria-pressed="false">Basic</button>
    <button id="b-intermediate" data-level="intermediate" aria-pressed="false">Intermediate</button>
    <button id="b-advanced" data-level="advanced" aria-pressed="false">Advanced</button>
  </div>

  <p id="status" class="status" aria-live="polite">Choose a level to start.</p>

  <section id="task" class="panel" hidden>
    <h2 id="levelName"></h2>
    <p id="problem"></p>
    <div class="check">
      <input id="answer" type="text" placeholder="Your answer, e.g. 5 or 12.6 m" aria-label="Your answer">
      <button id="checkBtn">Check</button>
    </div>
    <div id="feedback" hidden></div>
    <div class="actions">
      <button id="hintBtn">Give me a hint</button>
      <button id="solBtn">Show solution</button>
      <button id="newBtn">New problem</button>
    </div>
    <div id="hints"></div>
    <div id="solution" hidden></div>
  </section>

  <footer>Problems are generated by AI. Always double-check the maths with your teacher.</footer>
</main>

<script>
const NAMES = { basic:"Basic", intermediate:"Intermediate", advanced:"Advanced" };
const COLORS = { basic:"--basic", intermediate:"--inter", advanced:"--adv" };
let level = null, current = null, hintsShown = 0;
const $ = id => document.getElementById(id);

async function api(body) {
  const r = await fetch("/api/generate", { method:"POST",
    headers:{ "Content-Type":"application/json" }, body: JSON.stringify(body) });
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || "Something went wrong");
  return data;
}

async function load(lv) {
  level = lv;
  document.querySelectorAll(".levels button").forEach(b =>
    b.setAttribute("aria-pressed", b.dataset.level === lv));
  document.documentElement.style.setProperty("--accent", `var(${COLORS[lv]})`);
  $("task").hidden = true;
  $("status").textContent = "The AI is writing your problem…";
  try {
    current = await api({ mode:"generate", level:lv });
    hintsShown = 0;
    $("levelName").textContent = NAMES[lv] + " level";
    $("problem").textContent = current.problem;
    $("answer").value = "";
    $("hints").textContent = "";
    $("feedback").hidden = true; $("solution").hidden = true;
    $("status").textContent = "";
    $("task").hidden = false;
  } catch (e) { $("status").textContent = "Error: " + e.message + " Tap the level again to retry."; }
}

document.querySelectorAll(".levels button").forEach(b => b.onclick = () => load(b.dataset.level));
$("newBtn").onclick = () => load(level);

$("hintBtn").onclick = () => {
  if (hintsShown >= current.hints.length) return;
  const d = document.createElement("div"); d.className = "hint";
  d.textContent = `Hint ${hintsShown + 1}: ` + current.hints[hintsShown++];
  $("hints").appendChild(d);
};

$("solBtn").onclick = () => {
  const box = $("solution"); box.textContent = ""; box.className = "sol";
  const ol = document.createElement("ol");
  current.steps.forEach(s => { const li = document.createElement("li"); li.textContent = s; ol.appendChild(li); });
  const p = document.createElement("strong"); p.textContent = "Answer: " + current.answer;
  box.append(ol, p); box.hidden = false;
};

$("checkBtn").onclick = async () => {
  const val = $("answer").value.trim(); if (!val) return;
  const fb = $("feedback"); fb.hidden = false; fb.className = "fb"; fb.textContent = "Checking…";
  try {
    const r = await api({ mode:"check", level, problem:current.problem, answer:current.answer, studentAnswer:val });
    fb.className = "fb " + (r.correct ? "ok" : "no");
    fb.textContent = (r.correct ? "Correct! " : "Not quite. ") + r.feedback;
  } catch (e) { fb.textContent = "Error: " + e.message; }
};
</script>
</body>
</html>
